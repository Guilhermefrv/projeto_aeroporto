{% load static %}

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redefinir senha | Sky Bridge</title>
    <link rel="stylesheet" href="{% static 'css/login.css' %}">
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
<a href="{% url 'login' %}" class="back-link">
    <i class="fa-solid fa-arrow-left" aria-hidden="true"></i>
    Voltar
</a>

<div class="login-container">
    <div class="top-icon">
        <i class="fa-solid fa-key"></i>
    </div>

    <h1>Redefinir senha</h1>
    <p class="subtitle">
        Informe o e-mail cadastrado para receber um link seguro de alteracao.
    </p>

    <form method="post">
        {% csrf_token %}

        {% if form.email.errors %}
            <div class="field-errors" role="alert">
                {% for error in form.email.errors %}
                    <p>{{ error }}</p>
                {% endfor %}
            </div>
        {% endif %}

        <label for="{{ form.email.id_for_label }}">E-mail</label>
        <div class="input-group">
            <span><i class="fa-solid fa-envelope"></i></span>
            <input id="{{ form.email.id_for_label }}"
                   name="{{ form.email.html_name }}"
                   type="email"
                   placeholder="seu@email.com"
                   autocomplete="email"
                   required>
        </div>

        <button type="submit" class="btn-primary auth-submit">
            Enviar instrucoes
        </button>
    </form>

    <hr>

    <p class="signup-prompt">
        Lembrou sua senha?
        <a href="{% url 'login' %}">Entrar</a>
    </p>
</div>
</body>
</html>
