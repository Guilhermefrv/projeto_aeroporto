{% load static %}

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Criar Conta | Sky Bridge</title>

    <link rel="stylesheet" href="{% static 'css/cadastro.css' %}">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>
<a href="{% url 'auth_home' %}" class="back-link">
    <i class="fa-solid fa-arrow-left" aria-hidden="true"></i>
    Voltar
</a>

<main class="signup-page">
    <section class="signup-card" aria-labelledby="signup-title">
        <header class="signup-header">
            <div class="brand-icon">
                <i class="fa-solid fa-plane" aria-hidden="true"></i>
            </div>
            <div>
                <h1 id="signup-title">Sky Bridge</h1>
                <p>Crie sua conta gratuitamente</p>
            </div>
        </header>

        <form class="signup-form" action="#" method="post" data-noop-form>
            {% csrf_token %}

            <fieldset>
                <legend>Tipo de Usuario <span aria-hidden="true">*</span></legend>

                <div class="account-types" role="radiogroup" aria-label="Tipo de usuario">
                    <label class="type-card active">
                        <input type="radio" name="tipo" value="passageiro" checked>
                        <i class="fa-solid fa-users" aria-hidden="true"></i>
                        <strong>Passageiro</strong>
                        <span>Para reservar voos e fazer check-in</span>
                    </label>

                    <label class="type-card">
                        <input type="radio" name="tipo" value="funcionario">
                        <i class="fa-solid fa-user-tie" aria-hidden="true"></i>
                        <strong>Funcionario</strong>
                        <span>Para atendimento e operacoes</span>
                    </label>

                    <label class="type-card">
                        <input type="radio" name="tipo" value="administrador">
                        <i class="fa-solid fa-shield-halved" aria-hidden="true"></i>
                        <strong>Administrador</strong>
                        <span>Para gestao completa do sistema</span>
                    </label>
                </div>
            </fieldset>

            <div class="form-field full">
                <label for="nome">Nome Completo <span aria-hidden="true">*</span></label>
                <div class="input-group">
                    <i class="fa-solid fa-user" aria-hidden="true"></i>
                    <input id="nome" name="nome" type="text" placeholder="Joao da Silva" autocomplete="name" required>
                </div>
            </div>

            <div class="form-field full">
                <label for="email">Email <span aria-hidden="true">*</span></label>
                <div class="input-group">
                    <i class="fa-solid fa-envelope" aria-hidden="true"></i>
                    <input id="email" name="email" type="email" placeholder="seu@email.com" autocomplete="email" required>
                </div>
            </div>

            <div class="form-row">
                <div class="form-field">
                    <label for="telefone">Telefone <span aria-hidden="true">*</span></label>
                    <div class="input-group">
                        <i class="fa-solid fa-phone" aria-hidden="true"></i>
                        <input id="telefone" name="telefone" type="tel" placeholder="(11) 99999-9999" autocomplete="tel" required>
                    </div>
                </div>

                <div class="form-field">
                    <label for="cpf">CPF <span aria-hidden="true">*</span></label>
                    <div class="input-group">
                        <i class="fa-solid fa-id-card" aria-hidden="true"></i>
                        <input id="cpf" name="cpf" type="text" placeholder="000.000.000-00" required>
                    </div>
                </div>
            </div>

            <div class="form-row">
                <div class="form-field">
                    <label for="data_nascimento">Data de Nascimento</label>
                    <div class="input-group">
                        <i class="fa-solid fa-calendar" aria-hidden="true"></i>
                        <input id="data_nascimento" name="data_nascimento" type="date">
                    </div>
                </div>

                <div class="form-field">
                    <label for="nacionalidade">Nacionalidade</label>
                    <div class="input-group">
                        <i class="fa-solid fa-globe" aria-hidden="true"></i>
                        <input id="nacionalidade" name="nacionalidade" type="text" placeholder="Brasileira">
                    </div>
                </div>
            </div>

            <div class="form-row">
                <div class="form-field">
                    <label for="senha">Senha <span aria-hidden="true">*</span></label>
                    <div class="input-group">
                        <i class="fa-solid fa-lock" aria-hidden="true"></i>
                        <input id="senha" name="senha" type="password" autocomplete="new-password" required>
                    </div>
                </div>

                <div class="form-field">
                    <label for="confirmar_senha">Confirmar Senha <span aria-hidden="true">*</span></label>
                    <div class="input-group">
                        <i class="fa-solid fa-lock" aria-hidden="true"></i>
                        <input id="confirmar_senha" name="confirmar_senha" type="password" autocomplete="new-password" required>
                    </div>
                </div>
            </div>

            <button type="submit" class="submit-button">
                <i class="fa-solid fa-user-plus" aria-hidden="true"></i>
                Criar Conta
            </button>

            <p class="login-copy">
                Ja tem uma conta?
                <a href="{% url 'login' %}">Fazer login</a>
            </p>
        </form>
    </section>
</main>

<script>
    document.querySelectorAll('[data-noop-form]').forEach((form) => {
        form.addEventListener('submit', (event) => {
            event.preventDefault();
        });
    });
</script>
</body>
</html>
