{% load static %}

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instrucoes enviadas | Sky Bridge</title>
    <link rel="stylesheet" href="{% static 'css/login.css' %}">
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
<div class="login-container">
    <div class="top-icon">
        <i class="fa-solid fa-envelope-circle-check"></i>
    </div>

    <h1>Confira seu e-mail</h1>
    <p class="subtitle">
        Se o e-mail informado estiver cadastrado, enviamos um link para alterar sua senha.
        No ambiente local, o link aparece no terminal do servidor Django.
    </p>

    <div class="auth-card-actions">
        <a href="{% url 'login' %}" class="btn-primary auth-link-button">Voltar para login</a>
    </div>
</div>
</body>
</html>
